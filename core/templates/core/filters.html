<form method="get" class="filters"><input type="hidden" name="tab" value="{{ tab }}">{% if report %}<input type="hidden" name="report" value="{{ report }}">{% endif %}<input type="search" name="q" value="{{ request.GET.q }}" placeholder="ابحث برقم المهمة أو العنوان أو المسؤول" aria-label="البحث"><select name="unit" aria-label="الوحدة"><option value="">جميع الوحدات</option>{% for u in units %}<option value="{{ u.pk }}" {% if request.GET.unit == u.pk|stringformat:'s' %}selected{% endif %}>{{ u }}</option>{% endfor %}</select><select name="owner" aria-label="المسؤول"><option value="">جميع المسؤولين</option>{% for u in employees %}<option value="{{ u.pk }}" {% if request.GET.owner == u.pk|stringformat:'s' %}selected{% endif %}>{{ u }}</option>{% endfor %}</select><select name="status" aria-label="الحالة"><option value="">جميع الحالات</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="priority" aria-label="الأولوية"><option value="">جميع الأولويات</option>{% for value,label in priorities %}<option value="{{ value }}" {% if request.GET.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn secondary">تصفية</button><details class="advanced"><summary>فلاتر إضافية</summary><div class="fields-row"><label>من تاريخ<input type="date" name="from" value="{{ request.GET.from }}"></label><label>إلى تاريخ<input type="date" name="to" value="{{ request.GET.to }}"></label><label>المصدر<select name="source"><option value="">الكل</option>{% for value,label in sources %}<option value="{{ value }}" {% if request.GET.source == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>المشروع<input name="project" value="{{ request.GET.project }}"></label><label>الإنجاز من<input type="number" name="progress_min" min="0" max="100" value="{{ request.GET.progress_min }}"></label><label>الإنجاز إلى<input type="number" name="progress_max" min="0" max="100" value="{{ request.GET.progress_max }}"></label><label>رقم سجل الاجتماع<input type="number" name="decision__meeting" value="{{ request.GET.decision__meeting }}"></label></div></details></form>
