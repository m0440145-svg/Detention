services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped
  scheduler:
    build: .
    env_file: .env
    command: ["python", "manage.py", "run_scheduler"]
    volumes:
      - media:/app/media:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
