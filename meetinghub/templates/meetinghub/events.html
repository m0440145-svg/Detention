{% for event in events %}<article class="mail-event"><strong>{{ event.action }}</strong><small>{{ event.actor }} · {{ event.created_at|date:'Y/m/d H:i:s' }}</small><p>{{ event.reason }}</p><details><summary>تفاصيل التغيير</summary><pre>{{ event.details }}</pre></details><small class="mail-hash">SHA-256: {{ event.digest }}</small></article>{% empty %}<p class="muted">لا أحداث.</p>{% endfor %}
