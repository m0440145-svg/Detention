{% extends 'core/base.html' %}{% load mail_ui %}{% block content %}<section class="panel"><h1>{% ui "المصادقة المتعددة" %}</h1><p>{% ui "أضف حساب الإحسان في تطبيق المصادقة ثم أدخل الرمز. لا تشارك مفتاح التسجيل." %}</p>{% if uri %}<label for="totp-uri">{% ui "رابط الإعداد لتطبيق المصادقة" %}</label><textarea id="totp-uri" readonly dir="ltr">{{ uri }}</textarea>{% endif %}{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="code">{% ui "رمز من 6 أرقام" %}</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required><button class="btn">{% ui "تحقق" %}</button></form></section>{% endblock %}
